<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a6a49">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caja Súper"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Caja Súper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral de módulos + área de trabajo; el punto de venta divide productos (izq.) y ticket (der.) como una caja registradora */
:root{
  --bg:#eef0ea; --surface:#ffffff; --surface2:#e5e9e1; --ink:#14211a; --muted:#5a6a60; --line:#d3d9cf;
  --accent:#0a6a49; --accent-ink:#ffffff; --accent-soft:#d9eee4;
  --tag:#f5c518; --tag-ink:#231c00;
  --good:#1c8a4a; --warn:#a96a0a; --bad:#c23b2b; --bad-soft:#f8e1dd; --warn-soft:#faedcf; --good-soft:#dcf1e4;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,33,26,.06),0 6px 18px rgba(20,33,26,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#171f1a; --surface2:#202b24; --ink:#e7eee9; --muted:#93a399; --line:#2c3a31;
  --accent:#3fbf8c; --accent-ink:#04140d; --accent-soft:#17382b;
  --tag:#f5c518; --tag-ink:#231c00;
  --good:#4cc57f; --warn:#e0a640; --bad:#ef7b6b; --bad-soft:#3b1f1b; --warn-soft:#3a2d12; --good-soft:#163524;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#171f1a; --surface2:#202b24; --ink:#e7eee9; --muted:#93a399; --line:#2c3a31;
  --accent:#3fbf8c; --accent-ink:#04140d; --accent-soft:#17382b;
  --tag:#f5c518; --tag-ink:#231c00;
  --good:#4cc57f; --warn:#e0a640; --bad:#ef7b6b; --bad-soft:#3b1f1b; --warn-soft:#3a2d12; --good-soft:#163524;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-block:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%}
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);height:calc(100% - 20px);margin-block:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.nav{background:var(--surface2);display:flex;flex-direction:column;gap:2px;padding:12px 10px;overflow:auto;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:800}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-weight:500}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--line);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .sp{flex:1}
.nav .hint{font-size:11px;color:var(--muted);padding:8px;line-height:1.35}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:20px;flex:1;min-width:140px}
.top .meta{color:var(--muted);font-size:12px}
.view{flex:1;min-height:0;overflow:auto;padding:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.big{padding:13px 18px;font-size:16px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:34px;height:34px;padding:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:60px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.f.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 150px}
.row>.fit{flex:0 0 auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel h3{font-size:15px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface2);border-radius:10px;padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-mono);font-size:21px;font-weight:600;margin-top:2px}
.kpi small{color:var(--muted);font-size:12px}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
.cols.even{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.right{text-align:right}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface2);white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--accent-soft)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.hb{display:grid;grid-template-columns:minmax(80px,1.2fr) 3fr auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hb i{display:block;height:10px;border-radius:5px;background:var(--surface2);position:relative;overflow:hidden}
.hb i b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent);opacity:.55}.chart .bar.hl{opacity:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart text.v{fill:var(--ink)}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;height:100%}
.pos-left{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow:auto;align-content:start;padding:2px;flex:1;min-height:0}
.pc{display:flex;flex-direction:column;gap:6px;justify-content:space-between;text-align:left;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:98px}
.pc:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.pc[disabled]{opacity:.45;cursor:not-allowed}
.pc .nm{font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.pc .bt{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.pc small{color:var(--muted);font-size:11px}
.ptag{background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-weight:600;font-size:13px;padding:3px 8px 3px 12px;clip-path:polygon(7px 0,100% 0,100% 100%,7px 100%,0 50%);white-space:nowrap}
.pos-cart{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.pos-cart .hd{padding:10px;display:grid;gap:8px;border-bottom:1px solid var(--line);background:var(--surface2)}
.pos-cart .ln{flex:1;overflow:auto;min-height:120px}
.cl{padding:9px 12px;border-bottom:1px dashed var(--line);display:grid;gap:5px}
.cl .t{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.cl .t span:first-child{overflow-wrap:anywhere}
.cl .b{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{width:28px;height:28px;border:0;background:var(--surface2);cursor:pointer;font-size:16px}
.step input{width:56px;border:0;border-radius:0;text-align:center;padding:4px;font-family:var(--f-mono)}
.cl input.dsc{width:52px;padding:3px 6px;font-size:12px}
.tot{padding:10px 12px;border-top:1px solid var(--line);background:var(--surface);display:grid;gap:4px}
.tot .r{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.tot .grand{display:flex;justify-content:space-between;align-items:baseline;color:var(--ink);font-family:var(--f-display);font-size:19px;font-weight:800;padding-top:4px}
.tot .grand b{font-family:var(--f-mono);font-size:26px;font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 12px}
.acts .primary{grid-column:1/-1}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:500;margin-bottom:12px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(8,14,10,.55);display:grid;place-items:center;padding:16px;z-index:50}
.dlg{background:var(--surface);color:var(--ink);border-radius:14px;width:min(520px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.dlg.wide{width:min(820px,100%)}
.dlg header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg header h2{font-size:18px}
.dlg .x{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}
.dlg-b{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.paybox{background:var(--surface2);border-radius:10px;padding:12px;display:grid;gap:4px;text-align:center}
.paybox b{font-family:var(--f-mono);font-size:30px}
.paybox.ok b{color:var(--good)}.paybox.no b{color:var(--bad)}
.qk{display:flex;gap:6px;flex-wrap:wrap}

/* Recibo */
.rcpt{font-family:var(--f-mono);font-size:12px;background:#fffef8;color:#1b1b17;width:min(330px,100%);margin:0 auto;padding:16px 14px;border:1px solid #d8d5c6;box-shadow:0 2px 10px rgba(0,0,0,.15);position:relative;line-height:1.4}
.rcpt .c{text-align:center}
.rcpt hr{border:0;border-top:1px dashed #8a8774;margin:8px 0}
.rcpt .l{display:flex;justify-content:space-between;gap:8px}
.rcpt .l span:first-child{overflow-wrap:anywhere}
.rcpt .big{font-size:15px;font-weight:600}
.rcpt .bars{height:34px;margin:8px 8px 2px;background:repeating-linear-gradient(90deg,#1b1b17 0 2px,transparent 2px 4px,#1b1b17 4px 5px,transparent 5px 8px,#1b1b17 8px 11px,transparent 11px 13px)}
.rcpt .void{position:absolute;inset:40% 0 auto;text-align:center;font-size:34px;font-weight:600;color:#c23b2b;transform:rotate(-14deg);opacity:.75;border:3px solid #c23b2b;margin:0 22px;padding:2px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.dl dt{color:var(--muted)}.dl dd{margin:0;overflow-wrap:anywhere}

/* Login */
.login{height:100%;display:grid;place-items:center;padding:12px}
.lcard{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow);display:grid;gap:16px}
.lcard h1{font-size:30px}
.ulist{display:grid;gap:8px}
.ubtn{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.ubtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:600;flex:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:grid;gap:6px;pointer-events:none;width:max-content;max-width:calc(100% - 24px)}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}.toast.good{background:var(--good);color:#fff}

.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sbar{display:flex;gap:8px;align-items:stretch}.sbar input{flex:1}
.scan{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-height:44vh;width:100%}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan::after{content:"";position:absolute;inset:24% 10%;border:2px solid var(--tag);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.38);pointer-events:none}
.scmsg{padding:10px 12px;border-radius:10px;background:var(--surface2);text-align:center;font-weight:500;min-height:42px;overflow-wrap:anywhere}
.scmsg.ok{background:var(--good-soft);color:var(--good)}.scmsg.no{background:var(--bad-soft);color:var(--bad)}
label.btn.primary input{display:none}
.mbar,.mback{display:none}
@media (max-width:980px){
  .pos{grid-template-columns:minmax(0,1fr);height:auto}
  .pos-left{min-height:auto}.pgrid{max-height:none;overflow:visible}
  .pos-cart{overflow:visible}
  .pos .mbar{display:flex;position:sticky;bottom:0;justify-content:space-between;align-items:center;margin-top:6px;box-shadow:var(--shadow);z-index:5}
  .mback{display:inline-flex}
  .pos:not(.show-cart) .pos-cart{display:none}
  .pos.show-cart .pos-left{display:none}
  .pos-cart #cfoot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line)}
  .pos-cart .ln{max-height:none}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;height:100%;margin-block:0;border-radius:0;border-width:0}
  .nav{order:2;flex-direction:row;overflow-x:auto;border-right:0;border-top:1px solid var(--line);padding:6px;gap:2px}
  .nav .brand,.nav .sp,.nav .hint{display:none}
  .nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 10px;min-width:62px;align-items:center}
  .view{padding:12px max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  .top{padding-inline:max(16px,env(safe-area-inset-left,0px))}
  input,select,textarea{font-size:16px}
  .btn{min-height:40px}.btn.sm{min-height:34px}
  .ov{place-items:end center;padding:0}
  .dlg,.dlg.wide{width:100%;max-height:94%;border-radius:16px 16px 0 0}
  .dlg footer{padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(138px,1fr))}
  .top h1{font-size:17px}.top .meta:not(b){display:none}
  .kpi b{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>

<script>
'use strict';
/* ============ Utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const pad=(n,l=2)=>String(n).padStart(l,'0');
const num=n=>r2(n).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=n=>(DB.config.currency||'RD$')+' '+num(n);
const qf=n=>String(Math.round(Number(n)*100)/100);
const sum=(a,k)=>a.reduce((s,x)=>s+(typeof k==='function'?k(x):Number(x[k]||0)),0);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fdate=d=>new Date(d).toLocaleDateString('es-DO',{day:'2-digit',month:'short',year:'numeric'});
const ftime=d=>new Date(d).toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'});
const fdt=d=>fdate(d)+' '+ftime(d);
const today=()=>dkey(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

/* ============ Cálculos ============ */
function calcLines(items,gdisc,rate){
  let gross=0,discount=0,total=0,itbis=0;
  const lines=items.map(it=>{
    const g=it.qty*it.price,ld=g*(it.disc||0)/100;let net=g-ld;const gd=net*(gdisc||0)/100;net-=gd;
    const tax=it.taxed?net*rate/(1+rate):0;
    gross+=g;discount+=ld+gd;total+=net;itbis+=tax;
    return {gross:g,net,tax,disc:ld+gd}});
  total=r2(total);itbis=r2(itbis);
  return {lines,gross:r2(gross),discount:r2(discount),total,itbis,subtotal:r2(total-itbis)};
}
const calc=(items,g)=>calcLines(items,g,DB.config.itbis/100);
function cashSummaryFor(db,s){
  const sales=db.sales.filter(x=>x.cashId===s.id&&x.status==='ok');
  const by={efectivo:0,tarjeta:0,transferencia:0,credito:0};
  sales.forEach(x=>x.payments.forEach(p=>by[p.method]=r2(by[p.method]+p.amount)));
  const ab=db.payments.filter(p=>p.cashId===s.id),abCash=sum(ab.filter(p=>p.method==='efectivo'),'amount');
  const inn=sum((s.movements||[]).filter(m=>m.type==='in'),'amount'),out=sum((s.movements||[]).filter(m=>m.type==='out'),'amount');
  const voids=db.sales.filter(x=>x.cashId===s.id&&x.status==='anulada');
  return {count:sales.length,total:r2(sum(sales,'total')),by,abCash:r2(abCash),abTotal:r2(sum(ab,'amount')),inn:r2(inn),out:r2(out),voids:voids.length,voidTotal:r2(sum(voids,'total')),expected:r2(s.opening+by.efectivo+abCash+inn-out)};
}

  const W=640,H=o.h||210,pl=46,pr=8,pt=18,pb=26,n=data.length;
  const mx=Math.max(1,...data.map(d=>d.value));
  const step=Math.pow(10,Math.floor(Math.log10(mx))),nice=[1,2,2.5,5,10].map(x=>x*step).find(x=>x>=mx)||mx;
  const kf=v=>v>=1000?(v/1000)+'k':String(v);
  const bw=(W-pl-pr)/n,bar=Math.min(bw*.64,44);
  let g='';
  for(let i=0;i<=4;i++){const v=nice*i/4,y=pt+(H-pt-pb)*(1-i/4);g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${kf(v)}</text>`}
  data.forEach((d,i)=>{
    const h=(H-pt-pb)*d.value/nice,x=pl+bw*i+(bw-bar)/2,y=H-pb-h;
    g+=`<rect class="bar ${i===n-1?'hl':''}" x="${x}" y="${y}" width="${bar}" height="${Math.max(h,0)}" rx="3"><title>${esc(d.label)}: ${fmt(d.value)}</title></rect>`;
    if(n<=8)g+=`<text class="v" x="${x+bar/2}" y="${y-5}" text-anchor="middle">${kf(Math.round(d.value))}</text>`;
    g+=`<text x="${x+bar/2}" y="${H-8}" text-anchor="middle">${esc(d.label)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Gráfico de ventas')}">${g}</svg>`;
}
function dailySeries(from,to){
  const out=[];let d=new Date(from+'T12:00:00');const end=new Date(to+'T12:00:00');
  while(d<=end){const k=dkey(d);out.push({k,label:d.toLocaleDateString('es-DO',{weekday:'short',day:'numeric'}).replace('.',''),value:0});d=addDays(d,1)}
  const idx=Object.fromEntries(out.map((o,i)=>[o.k,i]));
  okSales().forEach(s=>{const i=idx[dkey(s.date)];if(i!=null)out[i].value=r2(out[i].value+s.total)});
  return out;
}
function topProducts(sales,n=8,by='rev'){

  return Object.values(m).sort((a,b)=>b[by]-a[by]).slice(0,n);
}

function payRefresh(){
  const c=ui.pay,total=ui.payTotal,paid=r2(sum(['cash','card','transfer','credit'],k=>Number(c[k]||0)));
  const rem=r2(total-paid),box=$('#pbox'),st=$('#pstat'),btn=$('#pconfirm');if(!box)return;
  const change=paid>total?r2(paid-total):0;
  const nonCash=r2(Number(c.card||0)+Number(c.transfer||0)+Number(c.credit||0));
  const valid=paid>=total-0.001&&change<=Number(c.cash||0)+0.001&&nonCash<=total+0.001;
  box.className='paybox '+(valid?'ok':'no');
  st.innerHTML=rem>0.001?`Falta <b class="num">${num(rem)}</b>`:`Cambio a devolver <b class="num" style="font-size:20px">${num(change)}</b>`;
  btn.disabled=!valid;
}
function confirmPay(){
  const c=ui.pay,cu=cust(ui.cust),cur=DB.cash.current;if(!cur)return;
  const total=calc(ui.cart,ui.gdisc).total;
  const cashIn=Number(c.cash||0),card=Number(c.card||0),tr=Number(c.transfer||0),cr=Number(c.credit||0);
  const paid=r2(cashIn+card+tr+cr),change=paid>total?r2(paid-total):0;
  if(cr>0){if(!cu.limit||cu.balance+cr>cu.limit+0.001){toast('El crédito supera el límite disponible del cliente','bad');return}}
  const payments=[];
  if(cashIn-change>0.001)payments.push({method:'efectivo',amount:r2(cashIn-change)});
  if(card>0)payments.push({method:'tarjeta',amount:r2(card)});
  if(tr>0)payments.push({method:'transferencia',amount:r2(tr)});
  if(cr>0)payments.push({method:'credito',amount:r2(cr)});
  const sale=makeSale(payments,cashIn,change);
  if(!sale)return;
  closeModal();resetTicket();viewPOS();showReceipt(sale.id,true);
}
function makeSale(payments,received,change){
  const c=calc(ui.cart,ui.gdisc),cur=DB.cash.current;
  let ncfT=ui.ncf,ncf='';
  if(ncfT!=='N'){const sq=DB.config.ncf[ncfT];if(sq.next>sq.limit){toast(`Se agotó la secuencia de comprobantes ${ncfT}. Ajusta el rango en Ajustes.`,'bad');return null}
    ncf=ncfT+pad(sq.next,8);sq.next++}
  DB.seq.sale++;
  const sale={id:'v'+DB.seq.sale+'-'+Date.now().toString(36),num:'F-'+pad(DB.seq.sale,6),date:new Date().toISOString(),ncfType:ncfT,ncf,userId:ui.user.id,customerId:ui.cust,
    items:ui.cart.map(i=>({...i})),gross:c.gross,discount:c.discount,gdisc:ui.gdisc||0,subtotal:c.subtotal,itbis:c.itbis,total:c.total,
    cost:r2(sum(ui.cart,i=>i.cost*i.qty)),payments,received:r2(received),change,status:'ok',cashId:cur.id};
  DB.sales.push(sale);
  sale.items.forEach(i=>{const p=prod(i.pid);if(p){p.stock=r2(p.stock-i.qty);DB.movements.push({id:uid('m'),at:sale.date,pid:p.id,type:'venta',qty:-i.qty,ref:sale.num,userId:ui.user.id})}});
  const cr=sum(payments.filter(p=>p.method==='credito'),'amount');if(cr>0)cust(ui.cust).balance=r2(cust(ui.cust).balance+cr);
  save();return sale;
}

  o.push('',C(cf.footer));return o.filter(x=>x!==undefined).join('\n');
}

function drawReport(){
  const f=ui.f.rep,S=salesBetween(f.from,f.to),B=$('#rbody');if(!B)return;
  const tot=sum(S,'total'),itb=sum(S,'itbis'),cost=sum(S,'cost'),sub=sum(S,'subtotal'),prof=sub-cost;
  const voided=DB.sales.filter(s=>s.status==='anulada'&&dkey(s.date)>=f.from&&dkey(s.date)<=f.to);
  const t=f.tab;
  if(t==='resumen'){
    const series=dailySeries(f.from,f.to),pm={};S.forEach(s=>s.payments.forEach(p=>pm[p.method]=(pm[p.method]||0)+p.amount));
    const hours={};S.forEach(s=>{const h=new Date(s.date).getHours();hours[h]=(hours[h]||0)+s.total});
    B.innerHTML=`<div class="stack"><div class="kpis"><div class="kpi"><span>Ventas totales</span><b>${fmt(tot)}</b><small>${S.length} facturas</small></div><div class="kpi"><span>Ticket promedio</span><b>${fmt(S.length?tot/S.length:0)}</b></div><div class="kpi"><span>ITBIS cobrado</span><b>${fmt(itb)}</b></div><div class="kpi"><span>Ganancia</span><b>${fmt(prof)}</b><small>Margen ${sub?(prof/sub*100).toFixed(1):0}%</small></div><div class="kpi"><span>Anuladas</span><b>${voided.length}</b><small>${fmt(sum(voided,'total'))}</small></div></div>
     <div class="panel"><h3>Ventas por día</h3>${series.length>31?'<div class="empty">Elige un período de hasta 31 días para ver el gráfico.</div>':barChart(series)}</div>
     <div class="cols even"><div class="panel"><h3>Por forma de pago</h3>${hbars(Object.entries(pm).map(([k,v])=>({l:METHODS[k],v})))}</div>
     <div class="panel"><h3>Por hora del día</h3>${hbars(Object.entries(hours).sort((a,b)=>a[0]-b[0]).map(([h,v])=>({l:pad(h)+':00',v})))}</div></div></div>`;
  }else if(t==='productos'){
    const l=topProducts(S,15,'rev');
    B.innerHTML=`<div class="panel"><div class="between"><h3>Productos más vendidos</h3><button class="btn sm" data-act="exp" data-id="productos">Exportar CSV</button></div>${l.length?`<div class="tw"><table><thead><tr><th>#</th><th>Producto</th><th>Categoría</th><th class="n">Cantidad</th><th class="n">Ingreso</th></tr></thead><tbody>${l.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td class="n">${qf(p.qty)}</td><td class="n">${num(p.rev)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sin ventas en este período.</div>'}</div>`;
  }else if(t==='cat'){
    const m={};S.forEach(s=>s.items.forEach(i=>{m[i.cat]=(m[i.cat]||0)+i.qty*i.price*(1-(i.disc||0)/100)*(1-(s.gdisc||0)/100)}));
    B.innerHTML=`<div class="panel"><h3>Ventas por categoría</h3>${hbars(Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v})))}</div>`;
  }else if(t==='cajeros'){
    const m={};S.forEach(s=>{const x=m[s.userId]||(m[s.userId]={n:0,t:0});x.n++;x.t+=s.total});
    B.innerHTML=`<div class="panel"><h3>Ventas por cajero</h3>${Object.keys(m).length?`<div class="tw"><table><thead><tr><th>Cajero</th><th class="n">Facturas</th><th class="n">Total</th><th class="n">Promedio</th></tr></thead><tbody>${Object.entries(m).map(([u,x])=>`<tr><td>${esc(userName(u))}</td><td class="n">${x.n}</td><td class="n">${num(x.t)}</td><td class="n">${num(x.t/x.n)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sin ventas en este período.</div>'}</div>`;
  }else if(t==='fiscal'){
    const byT={};S.forEach(s=>{const k=s.ncfType;const x=byT[k]||(byT[k]={n:0,sub:0,itb:0,tot:0});x.n++;x.sub+=s.subtotal;x.itb+=s.itbis;x.tot+=s.total});
    B.innerHTML=`<div class="stack"><div class="panel"><h3>Resumen por tipo de comprobante</h3><div class="tw"><table><thead><tr><th>Tipo</th><th class="n">Facturas</th><th class="n">Base</th><th class="n">ITBIS</th><th class="n">Total</th></tr></thead><tbody>${Object.entries(byT).map(([k,x])=>`<tr><td>${k==='N'?'Sin comprobante':k+' · '+NCF_TYPES[k]}</td><td class="n">${x.n}</td><td class="n">${num(x.sub)}</td><td class="n">${num(x.itb)}</td><td class="n">${num(x.tot)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin datos</td></tr>'}</tbody></table></div></div>
     <div class="panel"><div class="between"><h3>Detalle de ventas con NCF (tipo 607)</h3><button class="btn sm" data-act="exp" data-id="fiscal">Exportar CSV</button></div><div class="tw" style="max-height:340px"><table><thead><tr><th>NCF</th><th>Fecha</th><th>RNC cliente</th><th class="n">Base</th><th class="n">ITBIS</th><th class="n">Total</th></tr></thead><tbody>${S.filter(s=>s.ncf).slice(-200).reverse().map(s=>`<tr><td class="mono">${s.ncf}</td><td>${fdate(s.date)}</td><td class="mono">${esc(cust(s.customerId).rnc)||'—'}</td><td class="n">${num(s.subtotal)}</td><td class="n">${num(s.itbis)}</td><td class="n">${num(s.total)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
  }else if(t==='inv'){
    const P=DB.products.filter(p=>p.active),byC={};P.forEach(p=>{const x=byC[p.cat]||(byC[p.cat]={n:0,c:0,v:0});x.n++;x.c+=p.stock*p.cost;x.v+=p.stock*p.price});
    B.innerHTML=`<div class="stack"><div class="kpis"><div class="kpi"><span>Valor del inventario (costo)</span><b>${fmt(sum(P,p=>p.stock*p.cost))}</b></div><div class="kpi"><span>Valor a precio de venta</span><b>${fmt(sum(P,p=>p.stock*p.price))}</b></div><div class="kpi"><span>Productos activos</span><b>${P.length}</b></div><div class="kpi"><span>Bajo mínimo</span><b>${lowStock().length}</b></div></div>
     <div class="panel"><div class="between"><h3>Valor por categoría</h3><button class="btn sm" data-act="exp" data-id="inv">Exportar CSV</button></div><div class="tw"><table><thead><tr><th>Categoría</th><th class="n">Productos</th><th class="n">Costo</th><th class="n">Venta</th></tr></thead><tbody>${Object.entries(byC).map(([k,x])=>`<tr><td>${esc(k)}</td><td class="n">${x.n}</td><td class="n">${num(x.c)}</td><td class="n">${num(x.v)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
  }else{
    const l=DB.customers.filter(c=>c.balance>0).sort((a,b)=>b.balance-a.balance);
    B.innerHTML=`<div class="panel"><h3>Cuentas por cobrar</h3>${l.length?`<div class="tw"><table><thead><tr><th>Cliente</th><th>Teléfono</th><th class="n">Límite</th><th class="n">Saldo</th></tr></thead><tbody>${l.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td class="n">${num(c.limit)}</td><td class="n">${num(c.balance)}</td></tr>`).join('')}<tr><td colspan="3"><b>Total</b></td><td class="n"><b>${num(sum(l,'balance'))}</b></td></tr></tbody></table></div>`:'<div class="empty">Nadie debe nada.</div>'}</div>`;
  }
}
function exportReport(kind){
  const f=ui.f.rep,S=salesBetween(f.from,f.to);let rows,name;
  if(kind==='fiscal'){name=`ventas-ncf_${f.from}_${f.to}.csv`;rows=[['NCF','Fecha','RNC/Cédula','Cliente','Base sin ITBIS','ITBIS','Total','Forma de pago'],...S.filter(s=>s.ncf).map(s=>[s.ncf,dkey(s.date),cust(s.customerId).rnc,cust(s.customerId).name,s.subtotal,s.itbis,s.total,s.payments.map(p=>METHODS[p.method]).join('+')])]}
  else if(kind==='productos'){name=`productos-vendidos_${f.from}_${f.to}.csv`;rows=[['Producto','Categoría','Cantidad','Ingreso'],...topProducts(S,999).map(p=>[p.name,p.cat,qf(p.qty),r2(p.rev)])]}

  exportFile(name,csv(rows),'CSV');
}

/* ============ Escáner de códigos de barras y QR ============ */
const SC={stream:null,timer:0,reader:null,onCode:null,cont:false,last:'',lastAt:0};
let AC;
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=1100;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.09)}catch(e){}}
function stopScan(){clearTimeout(SC.timer);SC.timer=0;if(SC.reader){try{SC.reader.reset()}catch(e){}SC.reader=null}if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}SC.onCode=null}
function scanMsg(t,k=''){const m=$('#scmsg');if(m){m.className='scmsg '+k;m.textContent=t}}
function parseScan(raw){
  raw=String(raw).trim();
  if(raw[0]==='{'){try{const j=JSON.parse(raw);if(j&&j.code){const d={};['name','cat','unit','min','stock'].forEach(k=>{if(j[k]!=null)d[k]=j[k]});if(j.cost!=null)d.cost=j.cost;if(j.price!=null)d.price=j.price;return {code:String(j.code),data:d}}}catch(e){}}
  return {code:raw,data:{}};
}
const findByCode=c=>DB.products.find(p=>p.code===c||p.code.replace(/^0+/,'')===c.replace(/^0+/,''));
function loadZX(){
  if(window.ZXing)return Promise.resolve(window.ZXing);
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=()=>res(window.ZXing);s.onerror=()=>rej(new Error('zxing'));document.head.append(s)});
}
async function decodeFile(file){
  if('BarcodeDetector' in window){try{const bmp=await createImageBitmap(file),r=await new BarcodeDetector().detect(bmp);if(r.length)return r[0].rawValue}catch(e){}}
  const url=URL.createObjectURL(file);
  try{const ZX=await loadZX(),h=new Map();h.set(ZX.DecodeHintType.TRY_HARDER,true);const res=await new ZX.BrowserMultiFormatReader(h).decodeFromImageUrl(url);return res.getText()}
  catch(e){return null}finally{URL.revokeObjectURL(url)}
}
function handleCode(raw,force){
  if(!SC.onCode)return;raw=String(raw).trim();if(!raw)return;
  const now=Date.now();if(!force&&raw===SC.last&&now-SC.lastAt<1800)return;SC.last=raw;SC.lastAt=now;
  const r=SC.onCode(raw)||{};
  if(r.ok!==false){try{navigator.vibrate&&navigator.vibrate(40);beep()}catch(e){}}
  if(r.done){stopScan();return}
  scanMsg(r.msg||raw,r.ok===false?'no':'ok');
}
async function startLive(){
  const v=$('#scvid');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    if(!SC.onCode||!$('#scvid')){stream.getTracks().forEach(t=>t.stop());return}
    SC.stream=stream;v.srcObject=stream;await v.play();scanMsg('Apunta al código de barras o QR');
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector();
      const tick=async()=>{if(!SC.stream)return;try{if(v.readyState>=2){const r=await det.detect(v);if(r.length)handleCode(r[0].rawValue)}}catch(e){}SC.timer=setTimeout(tick,180)};tick();
    }else{
      const ZX=await loadZX();if(!SC.stream)return;
      SC.reader=new ZX.BrowserMultiFormatReader();SC.reader.decodeFromVideoElement(v,res=>{if(res)handleCode(res.getText())});
    }
  }catch(e){const w=$('#scwrap');if(w)w.hidden=true;scanMsg('La cámara en vivo no está disponible aquí. Usa "Tomar foto del código" o escribe el código.')}
}
function scanModal(title,onCode,cont=false){
  stopScan();SC.onCode=onCode;SC.cont=cont;SC.last='';
  modal(title,`<div class="scan" id="scwrap"><video id="scvid" playsinline muted></video></div>
   <div class="scmsg" id="scmsg">Iniciando cámara…</div>
   <label class="btn primary" style="cursor:pointer">${ico('scan')}<span>Tomar foto del código</span><input id="scfile" type="file" accept="image/*" capture="environment" data-chg="scfile"></label>
   <form class="sbar" data-form="scmanual"><input id="scman" placeholder="O escribe el código" autocomplete="off" aria-label="Código"><button class="btn" type="submit">Usar</button></form>
   <p class="muted" style="margin:0;font-size:12px">Lee códigos de barras y QR. Un lector Bluetooth o USB también funciona en el campo de texto.</p>`,
   {foot:`<button class="btn primary" data-act="close">${cont?'Terminar':'Cancelar'}</button>`,focus:false});
  startLive();
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal').innerHTML){closeModal();return}
  if(!ui.user)return;
  if(e.key==='F2'&&ui.view==='pos'){e.preventDefault();const q=$('#q');q&&q.focus()}
  if(e.key==='F4'&&ui.view==='pos'&&!$('#modal').innerHTML){e.preventDefault();openPay()}
  if(e.key==='Enter'&&e.target.id==='q'){
    e.preventDefault();const v=e.target.value.trim();if(!v)return;
    const l=DB.products.filter(p=>p.active),ex=l.find(p=>p.code===v);
    let hit=ex;if(!hit){const m=l.filter(p=>p.name.toLowerCase().includes(v.toLowerCase()));if(m.length===1)hit=m[0]}
    if(hit){addToCart(hit.id,1);e.target.value='';ui.q='';drawGrid()}else toast('Producto no encontrado','bad')}
  if(e.key==='Enter'&&e.target.closest('#modal')&&e.target.id&&e.target.id.startsWith('pay-')){const b=$('#pconfirm');if(b&&!b.disabled)confirmPay()}
});

 supplier:(f)=>{const id=f.id.value,d={name:f.name.value.trim(),rnc:f.rnc.value,contact:f.contact.value,phone:f.phone.value,email:f.email.value,address:f.address.value};
   if(id)Object.assign(DB.suppliers.find(s=>s.id===id),d);else DB.suppliers.push({id:uid('s'),...d});save();closeModal();viewCompras()},
 customer:(f)=>{const id=f.id.value,d={name:f.name.value.trim(),rnc:f.rnc.value.trim(),phone:f.phone.value,email:f.email.value,address:f.address.value,limit:Number(f.limit.value||0),notes:f.notes.value};
   let c;if(id){c=cust(id);Object.assign(c,d)}else{c={id:uid('c'),balance:0,...d};DB.customers.push(c)}
   save();closeModal();if(f.frompos.value){ui.cust=c.id;viewPOS()}else if(ui.view==='clientes')viewClientes();toast('Cliente guardado','good')},
 abono:(f)=>{const c=cust(f.id.value),amt=r2(Number(f.amount.value)),m=f.method.value;
   if(m==='efectivo'&&!DB.cash.current){toast('Abre la caja para recibir efectivo','bad');return}
   if(amt>c.balance+0.001){toast('El abono supera el saldo','bad');return}
   c.balance=r2(c.balance-amt);DB.payments.push({id:uid('ab'),customerId:c.id,amount:amt,method:m,at:new Date().toISOString(),cashId:DB.cash.current?DB.cash.current.id:null,userId:ui.user.id});save();closeModal();drawCli();toast('Abono registrado','good')},
 config:(f)=>{const c=DB.config;c.name=f.name.value;c.rnc=f.rnc.value;c.address=f.address.value;c.phone=f.phone.value;c.currency=f.currency.value||'RD$';c.itbis=Number(f.itbis.value);c.footer=f.footer.value;c.negStock=f.negStock.checked;
   ['B02','B01','B15'].forEach(k=>{c.ncf[k].next=Number(f[k+'_next'].value);c.ncf[k].limit=Number(f[k+'_limit'].value)});save();render();toast('Ajustes guardados','good')},
 user:(f)=>{const id=f.id.value,d={name:f.name.value.trim(),role:f.role.value,pin:f.pin.value,active:f.active.checked};
   if(id){const u=DB.users.find(x=>x.id===id);if(u.id===ui.user.id&&(!d.active||d.role!=='admin')){toast('No puedes quitarte el acceso de administrador','bad');return}Object.assign(u,d)}
   else DB.users.push({id:uid('u'),...d});save();closeModal();viewConfig()},
 restore:(f)=>{try{const d=JSON.parse(f.json.value);if(!d.config||!d.products||!d.sales)throw 0;DB=d;save();ui.user=null;closeModal();render();toast('Respaldo restaurado','good')}catch(e){toast('El respaldo no es válido','bad')}}
};
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(f,e)});

render();

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

</body></html>
